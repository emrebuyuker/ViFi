plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.salticusteam.vifi'
    compileSdk 35

    defaultConfig {
        applicationId "com.salticusteam.vifi"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 16
        versionName "2.5"
        testInstrumentationRunner "com.salticusteam.vifi.HiltTestRunner"
    }

    compileOptions {
        // java.time is API 26+; desugaring makes it safe on minSdk 24.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    lint {
        checkReleaseBuilds = false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError = false
    }

    // live: the shared vifi-831a8 Firebase backend. mock: bundled sample data, Firebase never
    // initialised (iOS -ViFiMockData) — debug only, see androidComponents below.
    flavorDimensions = ["backend"]
    productFlavors {
        live {
            dimension "backend"
        }
        mock {
            dimension "backend"
        }
    }

    // Release keys never live in the repo: keystore.properties (git-ignored) or CI secrets provide them.
    // Without that file the release build is produced unsigned.
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            def keystoreProperties = new Properties()
            keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

androidComponents {
    // Sample data must never ship: there is no mockRelease variant.
    beforeVariants(selector().withFlavor(new kotlin.Pair("backend", "mock")).withBuildType("release")) { variant ->
        variant.enable = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.play.services

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.kotlinx.serialization.json
    implementation libs.timber
    implementation libs.androidx.datastore.preferences
    // Exam file downloads (ARCH-08), page images (VIEW-05) and zoomable pages (VIEW-03): pure JVM, no native code.
    implementation libs.okhttp
    implementation libs.coil.compose
    implementation libs.telephoto.zoomable.image.coil

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    // Preview rendering + test host activity: debug only, never shipped in release.
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.database
    implementation libs.firebase.storage
    implementation libs.firebase.functions
    implementation libs.firebase.messaging
    implementation libs.firebase.appcheck.playintegrity
    debugImplementation libs.firebase.appcheck.debug

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.turbine
    testImplementation libs.mockk
    testImplementation libs.okhttp.mockwebserver
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    // compose ui-test pulls Espresso 3.5.x, which crashes on API 36+ (InputManager.getInstance removed).
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.navigation.testing
    androidTestImplementation libs.hilt.android.testing
    kspAndroidTest libs.hilt.compiler
}
