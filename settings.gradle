pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // SMT-01: AndroidMath (LaTeX typesetting) is only published on JitPack; scoped so nothing else resolves from it.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.gregcockroft' }
        }
    }
}

rootProject.name = 'ViFi'
include ':app'
// Baseline Profile generator (Macrobenchmark, mock flavor); see baselineprofile/build.gradle.
include ':baselineprofile'
