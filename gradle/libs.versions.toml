# Single source of truth for dependency and plugin versions.
# Legacy entries (Firebase 16.x, Picasso, commons-io) are replaced/removed by FM-06, FM-08 and later items.

[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
hilt = "2.52"
googleServices = "4.4.2"
coroutines = "1.9.0"

appcompat = "1.7.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
material = "1.12.0"

firebaseCore = "16.0.8"
firebaseAuth = "16.2.0"
firebaseDatabase = "16.1.0"
firebaseStorage = "16.1.0"
firebaseMessaging = "17.4.0"

pdfViewer = "3.2.0-beta.3"
picasso = "2.71828"
commonsIo = "1.3.2"

junit = "4.13.2"
turbine = "1.1.0"
mockk = "1.13.12"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
material = { module = "com.google.android.material:material", version.ref = "material" }

firebase-core = { module = "com.google.firebase:firebase-core", version.ref = "firebaseCore" }
firebase-auth = { module = "com.google.firebase:firebase-auth", version.ref = "firebaseAuth" }
firebase-database = { module = "com.google.firebase:firebase-database", version.ref = "firebaseDatabase" }
firebase-storage = { module = "com.google.firebase:firebase-storage", version.ref = "firebaseStorage" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }

# Maintained fork of barteksc/android-pdf-viewer (jcenter is gone); same com.github.barteksc.pdfviewer API.
pdf-viewer = { module = "com.github.mhiew:android-pdf-viewer", version.ref = "pdfViewer" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
commons-io = { module = "org.apache.commons:commons-io", version.ref = "commonsIo" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
